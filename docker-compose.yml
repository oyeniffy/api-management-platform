
services:
  postgres:
    image: postgres:16-alpine
    container_name: apm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apm_user
      POSTGRES_PASSWORD: apm_password
      POSTGRES_DB: apm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: apm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
